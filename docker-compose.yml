x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  volumes:
    - .:/var/www/html
  env_file: .env
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  worker:
    <<: *app
    command: php artisan queue:work redis --queue=default,bulk --tries=3 --backoff=10 --max-time=3600
    restart: unless-stopped

  scheduler:
    <<: *app
    command: php artisan schedule:work
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: saas
      MYSQL_USER: saas
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  mysql-data:
